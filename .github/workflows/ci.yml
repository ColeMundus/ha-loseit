name: Validate
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  scope:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Identify Markdown-only changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess

          known = {b"README.md", b"CONTRIBUTING.md", b"SECURITY.md", b"CHANGELOG.md"}
          diff = subprocess.run(
              ["git", "diff", "--name-only", "-z", "--no-renames", os.environ["BASE_SHA"], "HEAD", "--"],
              stdout=subprocess.PIPE,
              check=False,
          )
          paths = diff.stdout.split(b"\0")[:-1]
          docs_only = diff.returncode == 0 and bool(paths) and all(
              path in known or (path.startswith(b"docs/") and path.endswith(b".md"))
              for path in paths
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"docs_only={str(docs_only).lower()}", file=output)
          print("Markdown-only draft" if docs_only else "Full validation required")
          PYTHON

  draft-lint:
    if: needs.scope.outputs.docs_only == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: draft-lint
      - run: uv sync --locked
      - name: Run lint, formatting and available type checks
        shell: bash
        run: |
          status=0
          printf "\n> %s\n" "uv run --no-sync ruff check ."
          uv run --no-sync ruff check . || status=1
          printf "\n> %s\n" "uv run --no-sync ruff format --check ."
          uv run --no-sync ruff format --check . || status=1
          exit "$status"
  lint:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.19"
          python-version: "3.14.7"
          enable-cache: true
      - run: uv sync --locked
      - name: Run lint, formatting and available type checks
        shell: bash
        run: |
          status=0
          printf "\n> %s\n" "uv run --locked ruff check ."
          uv run --locked ruff check . || status=1
          printf "\n> %s\n" "uv run --locked ruff format --check ."
          uv run --locked ruff format --check . || status=1
          exit "$status"
  types:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.19"
          python-version: "3.14.7"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked mypy custom_components/loseit
  tests:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    name: Tests and coverage (90% minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.19"
          python-version: "3.14.7"
          enable-cache: true
      - run: uv sync --locked
      - name: Offline tests with branch coverage
        run: |
          mkdir -p artifacts
          uv run --locked pytest --junitxml=artifacts/junit.xml \
            --cov=custom_components/loseit --cov-branch \
            --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml \
            --cov-report=json:artifacts/coverage.json | tee artifacts/coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          if test -f artifacts/coverage.txt; then
            printf '### Offline tests and branch coverage (minimum 90%%)\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import os,pathlib; p=pathlib.Path("artifacts/coverage.txt"); open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(p.read_text())'
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: loseit-coverage
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  package:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft validation' || 'Package' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.19"
          python-version: "3.14.7"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_packaging.py tests/test_branding.py tests/test_release_tooling.py tests/test_workflows.py
      - run: uv run --locked python scripts/package.py --check
      - run: uv run --locked python scripts/package.py artifacts/loseit-manual-install.zip
      - run: cd artifacts && sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loseit-installation
          path: |
            artifacts/loseit-manual-install.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  hassfest:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
  hacs:
    needs: scope
    name: HACS (public only; local brands required)
    # HACS requires a public repository. A skip is NOT HACS acceptance.
    # The 22.5.0 wrapper uses ghcr.io/hacs/action:main (mutable, not version 22.5.0).
    # Inspected image revision 0704ffc6 supports integration/brand/icon.png.
    if: ${{ !cancelled() && (github.event.repository.private == false) && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
