# Local hooks deliberately share exact tool versions from uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (locked uv)
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format (locked uv)
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Integration types (locked uv)
        entry: uv run --locked mypy custom_components/loseit
        language: system
        pass_filenames: false
        types: [python]
      - id: package-check
        name: Distribution sources and notices
        entry: uv run --locked python scripts/package.py --check
        language: system
        pass_filenames: false
        always_run: true
